<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Platinum Lottery System - 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- TOP NAV -->
    <div class="top-nav">
      <button class="nav-tab" onclick="switchPage('G')">G</button>
      <button class="nav-tab" onclick="switchPage('H')">H</button>
      <button class="nav-tab active" onclick="switchPage('3D')">3D</button>
      <button class="nav-tab" onclick="switchPage('4D')">4D</button>
      <button class="nav-tab" onclick="switchPage('C')">C</button>
      <button class="nav-tab" onclick="switchPage('D')">D</button>
      <div class="nav-spacer"></div>
      <div class="nav-right">
        <span class="nav-datetime" id="navDatetime">2/3/2026 | 11:45:40</span>
        <span class="nav-loc" id="navLoc">LocV-1.0.0.2</span>
        <button class="icon-btn">
          <svg viewBox="0 0 100 100" width="34" height="34">
            <path d="M50 10 A40 40 0 1 1 50 90 A40 40 0 1 1 84.6 22.7" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" />
            <path d="M84.6 5 L84.6 22.7 L67 22.7" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <rect x="36" y="55" width="28" height="20" rx="3" fill="black" />
            <path d="M41 55 V50 A9 9 0 0 1 59 50 V55" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-btn power-btn">
          <svg viewBox="0 0 100 100" width="44" height="44">
            <path d="M50 20 V50" fill="none" stroke="#600" stroke-width="10" stroke-linecap="round" />
            <path d="M30 35 A30 30 0 1 0 70 35" fill="none" stroke="#600" stroke-width="10" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-area">
      <div class="page active" id="page-3D">
        <div class="s3-header-area">
          <div class="s3-logo-row">
            <div class="s3-logo-box">
              <img src="../image.png" alt="P" class="s3-plat-mini">
            </div>
            <div class="s3-ver-mini">V-1.3.6</div>
          </div>
          <div class="s3-topbar">
            <!-- First Grid Column -->
            <div class="s3-hdr-col s3-col-1">
              <div class="s3-hdr-left">
                <span class="s3-gamename">PLATINUM SPOTS3</span>
                <span class="s3-time" id="s3Time">12:00 pm</span>
              </div>
              <span class="s3-tx">200</span>
            </div>

            <!-- Second Grid Column -->
            <div class="s3-hdr-col s3-col-2">
              <span class="s3-ssvi-label">SSNE009</span>
              <div class="hdr-countdown s3-cnt-box" id="s3Countdown">12:41</div>
              <div class="s3-hdr-right">
                <div class="s3-limit-box">LIMIT : <span id="s3LimitVal">35318.74</span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="s3-body">
          <!-- DEFAULT LEFT PANEL (Normal View) -->
          <div class="s3-left" id="s3LeftNormal">
            <div class="s3-filterbar">
              <div class="s3-checkbox-area">
                <div class="s3-cbx-row s3-row-top">
                  <label class="s3-cbx"><input type="checkbox" id="indCbx" checked /><span class="cbx-lbl italic">Ind.</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="multiCbx" /><span class="cbx-lbl pink">Multi.</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="allCbxTop" /><span class="cbx-lbl pink">All.</span></label>
                </div>
                <div class="s3-cbx-row s3-row-bot">
                  <label class="s3-cbx"><input type="checkbox" id="cbxA" checked /><span class="cbx-lbl italic">A</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="cbxB" /><span class="cbx-lbl pink">B</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="cbxC" /><span class="cbx-lbl pink">C</span></label>
                </div>
              </div>
              <div class="s3-tbtn-group">
                <button class="s3-tbtn active"><div class="s3-tbtn-top"><div class="tbtn-check">✓</div></div><div class="s3-tbtn-bot">Box</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">Straight</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">FP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">BP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">SP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">AP</div></button>
              </div>
            </div>

            <div class="s3-digit-controls" style="display: flex; align-items: center; width: 100%;">
              <label class="s3-cbx-premium all digit-row-all" style="margin-right: 10px;"><input type="checkbox" id="allDigitsCbx" /><span class="cbx-lbl">ALL</span></label>
              <div class="s3-digit-row" id="s3Digits" style="display: flex; justify-content: space-between; flex: 1; gap: 5px;"></div>
            </div>

            <div id="screen1TopControls" class="s3-addnum-area">
              <input type="text" id="addNumberInput" class="s3-num-input" maxlength="3" placeholder="ADDNUMBER" style="width: 250px; margin-right: 15px;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              <span class="s3-range-lbl">Range-:</span>
              <input type="text" id="rangeFrom" class="s3-num-input" maxlength="3" placeholder="NUM" style="width: 90px;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              <span class="s3-to-lbl">To</span>
              <input type="text" id="rangeTo" class="s3-num-input" maxlength="3" placeholder="NUM" style="width: 90px;" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div id="screen2TopControls" style="display:none; flex-direction:column;">
              <div style="display:flex; justify-content:space-around; align-items:center; padding: 10px 40px; color:#fff; font-weight:bold; font-style:italic;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                  <input type="checkbox" id="motorSingle" checked style="width:16px; height:16px;"> Single
                </label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                  <input type="checkbox" id="motorDuplicates" style="width:16px; height:16px;"> Duplicates
                </label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                  <input type="checkbox" id="motorTriples" style="width:16px; height:16px;"> Triples
                </label>
              </div>
              <div style="display:flex; justify-content:center; margin-bottom: 10px;">
                 <button id="motorGenerateBtn" onclick="generateMotorBets()" style="background: linear-gradient(to bottom, #f3e5f5, #ce93d8); border:2px solid #000; border-radius:6px; padding:4px 40px; font-weight:900; font-style:italic; font-size:18px; color:#4a148c; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); cursor:pointer;">MOTOR</button>
              </div>
            </div>

            <div class="s3-main-selection-area" style="overflow-y: auto; flex: 1; min-height: 0; background: #004d11; padding-bottom: 16px; padding-top: 20px;">
              <div id="output" class="flex flex-wrap gap-2 p-2" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 80px 10px;"></div>
            </div>
          </div>

          <!-- MOTOR 1 GRID PANEL (Hidden by default) -->
          <div class="s3-left motor-grid-panel" id="s3LeftMotor" style="display:none;">
            <div class="s3-filterbar">
              <div class="s3-checkbox-area">
                <div class="s3-cbx-row s3-row-top">
                  <label class="s3-cbx"><input type="checkbox" id="motorIndCbx" checked /><span class="cbx-lbl italic">Ind.</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="motorMultiCbx" /><span class="cbx-lbl pink">Multi.</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="motorAllCbxTop" /><span class="cbx-lbl pink">All.</span></label>
                </div>
                <div class="s3-cbx-row s3-row-bot">
                  <label class="s3-cbx"><input type="checkbox" id="motorCbxA" checked /><span class="cbx-lbl italic">A</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="motorCbxB" /><span class="cbx-lbl pink">B</span></label>
                  <label class="s3-cbx"><input type="checkbox" id="motorCbxC" /><span class="cbx-lbl pink">C</span></label>
                </div>
              </div>
              <div class="s3-tbtn-group" id="motorBetTypes">
                <button class="s3-tbtn active"><div class="s3-tbtn-top"><div class="tbtn-check">✓</div></div><div class="s3-tbtn-bot">Box</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">Straight</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">FP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">BP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">SP</div></button>
                <button class="s3-tbtn"><div class="s3-tbtn-top"><div class="tbtn-box"></div></div><div class="s3-tbtn-bot">AP</div></button>
              </div>
            </div>

            <!-- MOTOR GRID: Row Range Sidebar + 10x10 Number Grid -->
            <div class="motor-grid-wrapper">
              <div class="motor-grid-sidebar" id="motorRangeSidebar">
                <label class="motor-range-all"><input type="checkbox" id="motorAllRanges" /><span>All</span></label>
                <!-- Range buttons generated by JS -->
              </div>
              <div class="motor-grid-main-area">
                <div class="motor-col-headers" id="motorColHeaders">
                  <!-- 10 col inputs generated by JS -->
                </div>
                <div class="motor-grid-body-row">
                  <div class="motor-row-headers" id="motorRowHeaders">
                    <!-- 10 row inputs generated by JS -->
                  </div>
                  <div class="motor-grid-numbers" id="motorGridNumbers">
                    <!-- 10x10 grid of numbers generated by JS -->
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="s3-right">
            <div class="s3-results-container">
              <div class="s3-results" id="s3Results"></div>
            </div>
            <div class="s3-football-panel">
              <div class="s3-stadium-area">
                <div class="s3-stadium-bg"></div>
              </div>
              <div class="s3-football-btns">
                <div style="flex: 1; pointer-events: none;"></div>
                <button class="s3-side-btn gold" onclick="reprintTicket()">Reprint<br>(F2)</button>
                <button class="s3-side-btn gold" onclick="openAdvanceModal()">Advance<br>Spot</button>
                <button class="s3-side-btn gold" onclick="openCancelModal()">Cancel<br>(F10)</button>
                <button class="s3-side-btn gold" onclick="clearSelections()">Clear<br>(ESC)</button>
                <button class="s3-side-btn green" id="playBtn" onclick="confirmPlay()">PLAY<br>(F7)</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3D bottom bar -->
    <div class="s3-bottom-bar high-fidelity" id="s3Bottom" style="display:flex;">
      <div class="s3-left-grid">
        <div class="s3-stats-box">
          <div class="s3-stat-item"><label>Total Selected spots</label><div class="s3-bval" id="statSpots">0</div></div>
          <div class="s3-stat-item"><label>Prize pool Contribution</label><div class="s3-bval" id="statPrize">0</div></div>
        </div>
        <div class="s3-stats-box">
          <div class="s3-stat-item"><label>Game service points</label><div class="s3-bval" id="statGameService">0</div></div>
          <div class="s3-stat-item"><label>Total Points</label><div class="s3-bval" id="statTotalPts">0</div></div>
        </div>
        <div class="s3-footer-ctrl">
          <button class="s3-rnd-pick" id="randomPickBtn">Random Pick</button>
          <div class="s3-family-box"><input type="checkbox" id="s3fam"><label for="s3fam">Family</label></div>
        </div>
      </div>
      <div class="s3-footer-global">
        <div class="s3-status-box" style="visibility: hidden; pointer-events: none;">
          <input type="text" placeholder="Pressed F8" style="width: 100%; height: 100%; border: none; background: transparent; color: #000; font-family: inherit; font-size: inherit; font-weight: inherit; text-align: center; outline: none;" />
        </div>
        <div class="s3-status-box">
  <input type="text" id="claimInput" placeholder="Pressed F8" style="width: 100%; height: 100%; border: none; background: transparent; color: #000; font-family: inherit; font-size: inherit; font-weight: inherit; text-align: center; outline: none;" onkeydown="if(event.key==='Enter') handleClaim()" />
</div>
        <button class="s3-glb-btn motor" id="motorToggleBtn" onclick="toggleMotorView()">MOTOR 1</button>
        <button class="s3-glb-btn screen" id="screenToggleBtn" onclick="toggleScreenView()">SCREEN 2</button>
        <button class="s3-glb-btn info" onclick="openBetHistoryModal()">INFO (I)</button>
      </div>
    </div>
    
    <div class="c-bottom-bar" id="cBottomBar" style="display:flex;">
      <button class="c-scheme">Scheme</button>
    </div>
  </div> 

  <!-- ADVANCE SPOT MODAL -->
  <div id="advanceModal" class="modal-overlay" style="display:none;">
    <div class="modal-content history-modal">
      <div class="modal-header">
        <h2>ADVANCE SPOT</h2>
        <button class="close-modal" onclick="closeAdvanceModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px; padding:0 5px;">
          <span style="color:#f1ce07; font-weight:bold;">Number of Draws:</span>
          <input type="number" id="advanceDrawCountInp" min="1" placeholder="Type number..." style="width:120px; padding:8px; border-radius:4px; border:1px solid #444; background:#000; color:#fff; outline:none;" oninput="this.value = this.value.replace(/[^0-9]/g, ''); selectXDraws(this.value)" />
          <span style="color:#aaa; font-size:12px; margin-left:auto;">Selected: <b id="selectedDrawCount" style="color:#0f0;">0</b></span>
        </div>
        <div class="draw-grid-container" id="advanceDrawGrid">
          <p style="text-align:center; color:#aaa; font-style:italic;">No advance draws available.</p>
        </div>
      </div>
      <div class="modal-footer" style="padding:15px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid #333;">
        <button class="nav-tab" onclick="closeAdvanceModal()" style="width:auto; padding:0 20px; margin:0; background:#444; color:#fff;">CANCEL</button>
        <button class="nav-tab active" onclick="confirmAdvanceDraw()" style="width:auto; padding:0 20px; margin:0;">OK</button>
      </div>
    </div>
  </div>

  <!-- CANCEL MODAL -->
  <div id="cancelBetModal" class="modal-overlay" style="display:none;">
    <div class="modal-content history-modal" style="width:800px;">
      <div class="modal-header">
        <h2>CANCEL BET HISTORY</h2>
        <button class="close-modal" onclick="closeCancelModal()">&times;</button>
      </div>
      <div class="modal-body">
        <table class="history-table" style="width:100%; border-collapse:collapse; color:#ddd; font-family:'Oswald', sans-serif;">
          <thead>
            <tr style="background:#222; color:#f1ce07; text-align:left;">
              <th style="padding:10px; border-bottom:1px solid #444;">ID</th>
              <th style="padding:10px; border-bottom:1px solid #444;">Barcode</th>
              <th style="padding:10px; border-bottom:1px solid #444;">Draw</th>
              <th style="padding:10px; border-bottom:1px solid #444;">Amount</th>
              <th style="padding:10px; border-bottom:1px solid #444;">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" style="padding:20px; text-align:center; color:#666;">No recent bets found.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  </div>
 

  <script src="../config.js"></script>
  <script src="../api.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
